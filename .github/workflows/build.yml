name: Build Pygame APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git unzip zip \
            autoconf libtool pkg-config \
            zlib1g-dev cmake libffi-dev libssl-dev automake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36 setuptools==69.5.1 wheel

      - name: Clean Buildozer output
        run: |
          rm -rf bin .buildozer

      - name: Build Debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: buildozer -v android debug

      - name: Verify APK
        run: |
          ls -l bin/*.apk
          unzip -t bin/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-runner-apk
          path: bin/*.apk
          if-no-files-found: error
